<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Agda Playground</title>
    <link rel="icon" href="%sveltekit.assets%/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <script>
      // Apply a forced light/dark appearance (Settings > Appearance) before
      // first paint, so it doesn't flash. Mirrors applyToDocument() in
      // src/lib/appearance.svelte.js; same storage key.
      try {
        var theme = localStorage.getItem('agda-playground.appearance.v1')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
    <style>
      body, html { box-sizing: border-box; width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden }
      *, *:before, *:after { box-sizing: inherit; }
      body > div:first-child { display: contents; }
    </style>
    <link rel="stylesheet" href="%sveltekit.assets%/julia-mono.css">
    <script src="./coi-serviceworker.js"></script>
%sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div>%sveltekit.body%</div>
    <noscript>Agda Playground needs JavaScript and WebAssembly to run Agda in your browser.</noscript>
  </body>
</html>
